[package]
name = "mongol-convert-cabi"
version = "0.7.1"
edition.workspace = true
license.workspace = true
description = "C ABI binding for mongol-convert (loadable by PHP-FFI, cgo, JNI / Java Panama, ctypes, ...)."

[lib]
name = "mongol_convert"
# cdylib -> libmongol_convert.{dylib,so,dll} for runtime loading (PHP FFI, cgo, ...);
# staticlib -> libmongol_convert.a for static linking (e.g. cgo without a shared object).
crate-type = ["cdylib", "staticlib"]

[dependencies]
mongol-convert = { path = "../mongol-convert" }
