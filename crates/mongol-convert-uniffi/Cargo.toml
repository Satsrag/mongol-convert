[package]
name = "mongol-convert-uniffi"
version = "0.7.0"
edition.workspace = true
license.workspace = true
description = "UniFFI binding for mongol-convert: idiomatic Swift (iOS) and Kotlin (Android) from one crate."

[lib]
name = "mongol_convert_uniffi"
# staticlib (.a) is needed for the iOS XCFramework; cdylib for Android/desktop; lib for the bindgen bin.
crate-type = ["staticlib", "cdylib", "lib"]

# Self-contained bindings generator: `cargo run -p mongol-convert-uniffi --bin uniffi-bindgen -- ...`
[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
mongol-convert = { path = "../mongol-convert" }
uniffi = { version = "0.31", features = ["cli"] }
thiserror = "2"
