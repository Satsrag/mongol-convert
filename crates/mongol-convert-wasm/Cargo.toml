[package]
name = "mongol-convert-wasm"
version = "0.7.0"
edition.workspace = true
license.workspace = true
description = "WebAssembly binding for mongol-convert: an npm package for the browser, Node, Deno/Bun and edge runtimes."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mongol-convert = { path = "../mongol-convert" }
wasm-bindgen = "0.2"
