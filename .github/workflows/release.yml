# Release pipeline (download model): on a version tag, build every platform artifact from the one
# Rust core, publish mongol-convert to crates.io, and attach every platform artifact to a GitHub Release.
# crates.io publication uses Trusted Publishing (GitHub OIDC) from the protected `crates-io`
# environment; no long-lived registry token is stored in GitHub.
#
# Assumes mongol-convert is its own repository (root = this directory).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish-crates:
    needs: [c-libs, wasm, apple, android]
    if: github.repository == 'Satsrag/mongol-convert'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Select Rust 1.82.0
        run: rustup toolchain install 1.82.0 --profile minimal && rustup default 1.82.0
      - name: Verify tag and merged source
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "mongol-convert") | .version')
          test "$GITHUB_REF_NAME" = "v$version"
          git fetch --force origin main:refs/remotes/origin/main \
            "refs/tags/$GITHUB_REF_NAME:refs/tags/release-remote" --no-tags
          source_sha=$(git rev-parse HEAD)
          test "$(git rev-list -n 1 refs/tags/release-remote)" = "$source_sha"
          git merge-base --is-ancestor "$source_sha" origin/main
      - name: Build package and check registry state
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "mongol-convert") | .version')
          archive="target/package/mongol-convert-$version.crate"
          rm -rf "target/package/mongol-convert-$version" "$archive"
          cargo package -p mongol-convert --locked
          local_checksum=$(sha256sum "$archive" | cut -d' ' -f1)
          status=$(curl --fail-with-body --retry 3 --retry-connrefused \
            --user-agent 'mongol-convert-release-workflow' --output /tmp/crates-version.json \
            --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/mongol-convert/$version" || true)
          case "$status" in
            404)
              echo 'publish=true' >> "$GITHUB_OUTPUT"
              ;;
            200)
              remote_checksum=$(jq -er '.version.checksum' /tmp/crates-version.json)
              test "$local_checksum" = "$remote_checksum"
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              echo "mongol-convert $version already exists with the expected checksum"
              ;;
            *)
              echo "unexpected crates.io response: HTTP $status" >&2
              cat /tmp/crates-version.json >&2
              exit 1
              ;;
          esac
      - name: Revalidate remote tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin \
            "refs/tags/$GITHUB_REF_NAME:refs/tags/release-remote" --no-tags
          test "$(git rev-list -n 1 refs/tags/release-remote)" = "$(git rev-parse HEAD)"
      - name: Authenticate to crates.io with GitHub OIDC
        if: steps.registry.outputs.publish == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish mongol-convert to crates.io
        if: steps.registry.outputs.publish == 'true'
        run: cargo publish -p mongol-convert --locked --registry crates-io --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Verify crates.io publication
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "mongol-convert") | .version')
          archive="target/package/mongol-convert-$version.crate"
          local_checksum=$(sha256sum "$archive" | cut -d' ' -f1)
          for attempt in {1..18}; do
            status=$(curl --retry 3 --retry-connrefused \
              --user-agent 'mongol-convert-release-workflow' --output /tmp/crates-version.json \
              --write-out '%{http_code}' \
              "https://crates.io/api/v1/crates/mongol-convert/$version" || true)
            case "$status" in
              200)
                remote_checksum=$(jq -er '.version.checksum' /tmp/crates-version.json)
                test "$local_checksum" = "$remote_checksum"
                exit 0
                ;;
              404|429|500|502|503|504)
                sleep 10
                ;;
              *)
                echo "unexpected crates.io response: HTTP $status" >&2
                cat /tmp/crates-version.json >&2
                exit 1
                ;;
            esac
          done
          echo "timed out waiting for mongol-convert $version on crates.io" >&2
          exit 1

  # C ABI: static (.a/.lib) + dynamic (.so/.dylib/.dll) + mongol_convert.h, per platform — for C / Go-cgo /
  # Python / Dart / Java / any language that loads a C library.
  c-libs:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  name: linux-x86_64 }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu, name: linux-aarch64, cross: true }
          - { os: macos-latest,   target: aarch64-apple-darwin,      name: macos-arm64 }
          - { os: macos-latest,   target: x86_64-apple-darwin,       name: macos-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    name: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with: { targets: "${{ matrix.target }}" }
      - if: ${{ matrix.cross }}
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - run: cargo build -p mongol-convert-cabi --release --target ${{ matrix.target }}
      - name: stage
        shell: bash
        run: |
          d=mongol-convert-c-${{ matrix.name }}; mkdir -p "$d"
          cp crates/mongol-convert-cabi/mongol_convert.h "$d"/
          libdir=target/${{ matrix.target }}/release
          case "${{ matrix.name }}" in
            linux-x86_64|linux-aarch64)
              cp "$libdir/libmongol_convert.a" "$libdir/libmongol_convert.so" "$d"/
              ;;
            macos-arm64|macos-x86_64)
              cp "$libdir/libmongol_convert.a" "$libdir/libmongol_convert.dylib" "$d"/
              ;;
            windows-x86_64)
              cp "$libdir/mongol_convert.lib" "$libdir/mongol_convert.dll" "$libdir/mongol_convert.dll.lib" "$d"/
              ;;
            *)
              echo "unknown C artifact matrix entry: ${{ matrix.name }}" >&2
              exit 1
              ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "mongol-convert-c-${{ matrix.name }}", path: "mongol-convert-c-${{ matrix.name }}" }

  # WebAssembly npm packages as downloadable browser/web and Node tarballs.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with: { targets: "wasm32-unknown-unknown" }
      - run: cargo install wasm-pack --version 0.15.0 --locked
      - name: package browser/web target
        run: |
          version="${GITHUB_REF_NAME#v}"
          wasm-pack build crates/mongol-convert-wasm --target web --out-dir pkg-web --out-name mongol_convert --locked
          (cd crates/mongol-convert-wasm/pkg-web && npm pack)
          mv crates/mongol-convert-wasm/pkg-web/*.tgz "mongol-convert-wasm-web-${version}.tgz"
      - name: package and verify Mongolian conversion skill
        run: python3 tools/package-mongolian-convert.py --wasm-dir crates/mongol-convert-wasm/pkg-web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mongol-convert-skills
          path: target/skills/mongolian-convert-*.zip*
          if-no-files-found: error
      - name: package Node target
        run: |
          version="${GITHUB_REF_NAME#v}"
          wasm-pack build crates/mongol-convert-wasm --target nodejs --out-dir pkg-node --out-name mongol_convert
          (cd crates/mongol-convert-wasm/pkg-node && npm pack)
          mv crates/mongol-convert-wasm/pkg-node/*.tgz "mongol-convert-wasm-nodejs-${version}.tgz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: mongol-convert-wasm-npm, path: "mongol-convert-wasm-*.tgz" }

  # Apple xcframeworks: Swift (UniFFI) for Swift apps, and the C ABI for Objective-C / C.
  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with: { targets: "aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios" }
      - name: Swift xcframework (UniFFI)
        run: |
          cargo build -p mongol-convert-uniffi --release --target aarch64-apple-ios
          cargo build -p mongol-convert-uniffi --release --target aarch64-apple-ios-sim
          cargo build -p mongol-convert-uniffi --release --target x86_64-apple-ios
          cargo run -p mongol-convert-uniffi --bin uniffi-bindgen -- generate \
            --library target/aarch64-apple-ios/release/libmongol_convert_uniffi.dylib --language swift --out-dir sw
          mkdir -p hdr && cp sw/*.h sw/*.modulemap hdr/
          lipo -create \
            target/aarch64-apple-ios-sim/release/libmongol_convert_uniffi.a \
            target/x86_64-apple-ios/release/libmongol_convert_uniffi.a \
            -output libmongol_convert_uniffi-simulator.a
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libmongol_convert_uniffi.a -headers hdr \
            -library libmongol_convert_uniffi-simulator.a -headers hdr \
            -output MongolConvertSwift.xcframework
          zip -r MongolConvertSwift.xcframework.zip MongolConvertSwift.xcframework sw/mongol_convert_uniffi.swift
      - name: C ABI xcframework (ObjC / C)
        run: |
          cargo build -p mongol-convert-cabi --release --target aarch64-apple-ios
          cargo build -p mongol-convert-cabi --release --target aarch64-apple-ios-sim
          cargo build -p mongol-convert-cabi --release --target x86_64-apple-ios
          mkdir -p ch && cp crates/mongol-convert-cabi/mongol_convert.h ch/
          printf 'module MongolConvert { header "mongol_convert.h"\n export * }\n' > ch/module.modulemap
          lipo -create \
            target/aarch64-apple-ios-sim/release/libmongol_convert.a \
            target/x86_64-apple-ios/release/libmongol_convert.a \
            -output libmongol_convert-simulator.a
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libmongol_convert.a -headers ch \
            -library libmongol_convert-simulator.a -headers ch \
            -output MongolConvertC.xcframework
          zip -r MongolConvertC.xcframework.zip MongolConvertC.xcframework
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: mongol-convert-apple, path: "*.xcframework.zip" }

  # Android AAR (UniFFI Kotlin + cargo-ndk .so for all ABIs).
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with: { targets: "aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android" }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with: { gradle-version: "8.10.2" } # AGP 8.5 isn't compatible with Gradle 9
      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        with: { ndk-version: r26d, add-to-path: true }
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o bindings/android/src/main/jniLibs build -p mongol-convert-uniffi --release
          cargo run -p mongol-convert-uniffi --bin uniffi-bindgen -- generate \
            --library target/aarch64-linux-android/release/libmongol_convert_uniffi.so \
            --language kotlin --out-dir bindings/android/src/main/kotlin
          cd bindings/android && gradle assembleRelease
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: mongol-convert-android-aar, path: bindings/android/build/outputs/aar/*.aar }

  # Gather everything and cut a downloadable GitHub Release.
  release:
    needs: [publish-crates, c-libs, wasm, apple, android]
    # Default job semantics are intentionally fail-closed: every platform build and the crates.io
    # publication must succeed before GitHub Release assets are created.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Revalidate remote tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin \
            "refs/tags/$GITHUB_REF_NAME:refs/tags/release-remote" --no-tags
          test "$(git rev-list -n 1 refs/tags/release-remote)" = "$(git rev-parse HEAD)"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { path: artifacts }
      - name: zip per-platform C libs
        run: |
          cd artifacts
          for d in mongol-convert-c-*; do zip -r "../$d.zip" "$d"; done
          cd ..
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            mongol-convert-c-*.zip
            artifacts/mongol-convert-wasm-npm/*.tgz
            artifacts/mongol-convert-skills/*.zip
            artifacts/mongol-convert-skills/*.sha256
            artifacts/mongol-convert-apple/*.zip
            artifacts/mongol-convert-android-aar/*.aar

  # Publish the browser converter to the tools site.
  #
  # Runs after `release`, so the page never advertises a version whose artifacts failed to build,
  # and it is the same `build.sh` a human would run — one way to build the page, not two.
  #
  # Needs a deploy key because GITHUB_TOKEN cannot reach another repository: generate one, put the
  # public half on Satsrag/satsrag.github.io as a deploy key *with write access*, and the private
  # half here as the PAGE_DEPLOY_KEY secret. Without it the job says so and skips rather than
  # failing a release that is otherwise complete.
  deploy-page:
    needs: [release]
    if: github.repository == 'Satsrag/mongol-convert'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - name: Check for the deploy key
        id: key
        env:
          DEPLOY_KEY: ${{ secrets.PAGE_DEPLOY_KEY }}
        run: |
          if [ -n "$DEPLOY_KEY" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo '::notice::PAGE_DEPLOY_KEY is not set - skipping the page deploy.'
          fi
      # The site is checked out first on purpose: its convert/fonts are already committed, and
      # build.sh only fetches a font it does not find, so a release does not depend on the font
      # hosts being up.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.key.outputs.present == 'true'
        with:
          repository: Satsrag/satsrag.github.io
          path: site
          ssh-key: ${{ secrets.PAGE_DEPLOY_KEY }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: steps.key.outputs.present == 'true'
        with: { targets: "wasm32-unknown-unknown" }
      - name: Install wasm-bindgen at the version the lockfile pins
        if: steps.key.outputs.present == 'true'
        run: |
          set -euo pipefail
          version=$(cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version' | head -1)
          # The CLI and the crate must match exactly or the generated glue does not load.
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Build the page into the site checkout
        if: steps.key.outputs.present == 'true'
        run: bash crates/mongol-convert-wasm/web/build.sh "$GITHUB_WORKSPACE/site/convert"
      - name: Commit and push if anything moved
        if: steps.key.outputs.present == 'true'
        working-directory: site
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo 'The published page already matches this release.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add convert
          git commit -m "deploy(convert): mongol-convert ${GITHUB_REF_NAME#v}" \
            -m "Built from Satsrag/mongol-convert crates/mongol-convert-wasm/web at ${GITHUB_REF_NAME}."
          git push
