name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown
      # Unit tests + the 11,492-row golden parity (vs the committed Java oracle output)
      # + the randomized no-panic fuzz test, across the whole workspace.
      # UTN #57 output is part of the default build: the pure-Rust `zvvnmod-utn57` backend is
      # linked in, so no Python, installer, or command is needed anywhere in CI.
      - run: cargo test --workspace --locked
      - run: rustup toolchain install 1.82.0 --profile minimal
      - run: cargo +1.82.0 test -p mongol-convert --all-targets --locked
      # The deprecated no-op feature must keep compiling for existing install commands.
      - run: cargo +1.82.0 check -p mongol-convert --features utn57-command --locked
      # Ensure the web binding (UTN #57 included) still compiles to wasm.
      - run: cargo build -p mongol-convert-wasm --target wasm32-unknown-unknown --locked
      - name: Install matching wasm-bindgen CLI for skill packaging
        run: |
          version=$(cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          cargo install wasm-bindgen-cli --version "$version" --locked
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '18' }
      - name: Package and test the skill on Node.js 18
        run: |
          wasm-bindgen --target web --out-name mongol_convert --out-dir target/skill-wasm \
            target/wasm32-unknown-unknown/debug/mongol_convert_wasm.wasm
          python3 tools/package-mongolian-convert.py --wasm-dir target/skill-wasm
