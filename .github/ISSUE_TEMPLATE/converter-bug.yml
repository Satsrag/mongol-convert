name: Conversion bug / 转换问题
description: A word converts wrongly, errors out, or two encodings disagree. / 某个词转换结果不对、报错，或者两种编码之间对不上。
title: "[convert] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Most fields are prefilled by the **Report** button in the
        [online converter](https://www.satsrag.dev/convert/) — click it there and it brings the
        code-point sequences here. Filling them by hand is fine too; code-point sequences are far
        more useful than prose.

        大部分字段可以由[在线转换器](https://www.satsrag.dev/convert/)的「报个问题」按钮自动填好 ——
        在页面上点它，会带着码点序列跳到这里。手工填也可以，**码点序列比描述有用得多**。

  - type: textarea
    id: what
    attributes:
      label: What went wrong / 出了什么问题
      description: A sentence or two is enough. / 一两句话就够。
      placeholder: Converting ᠰᠠᠶᠢᠨ from delehi to utn57, the final letter should be ᠨ but comes out as ᠠ + FVS2.
    validations:
      required: true

  - type: input
    id: from-encoding
    attributes:
      label: Source encoding / 源编码
      placeholder: delehi
    validations:
      required: true

  - type: input
    id: to-encoding
    attributes:
      label: Target encoding / 目标编码
      placeholder: utn57
    validations:
      required: true

  - type: textarea
    id: input
    attributes:
      label: Input / 输入
      description: |
        The text and its code points, one line each. The text can be pasted straight back into the
        converter to reproduce; the code points disambiguate it.
        原文和码点各一行。原文可以直接粘回转换器复现，码点用来消歧。
      render: text
      placeholder: |
        text: ᠰᠠᠶᠢᠨ
        code: U+1830 U+1820 U+180D U+1822 U+180D U+1822 U+1828
    validations:
      required: true

  - type: textarea
    id: hub
    attributes:
      label: Hub / 中间码 zvvnmod
      description: |
        Conversion runs source → zvvnmod → target, so this middle value usually says which half is
        at fault. / 转换是 源 → zvvnmod → 目标，中间这一步往往能指出问题出在哪一半。
      render: text

  - type: textarea
    id: actual
    attributes:
      label: Actual output / 实际输出
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected output / 期望输出
      description: |
        Code points are best; saying what shape it should render as also works.
        码点序列最好；写清楚「应该显示成什么字形」也行。
      render: text

  - type: textarea
    id: mongol-convert-error
    attributes:
      label: Error from mongol-convert / mongol-convert 报的错
      description: Paste it verbatim if there was one; leave empty otherwise. / 有的话贴原文；没报错就留空。
      render: text

  - type: textarea
    id: mongol-convert-warning
    attributes:
      label: Warning from mongol-convert / mongol-convert 警告
      description: The converter fills this in when the conversion succeeded but had to invent a ZWJ; leave empty otherwise. / 转换成功但插入了 ZWJ 时转换器会自动填上；没有就留空。
      render: text

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot / 截图
      description: |
        For a shaping problem a picture beats any description. The converter's **Report** button puts
        a screenshot on your clipboard — paste it here with Cmd/Ctrl+V and GitHub uploads it.
        字形不对的问题，一张图胜过描述。转换器的「报个问题」会把截图放进剪贴板 ——
        在这个框里按 Cmd/Ctrl+V 粘贴，GitHub 会自动上传。
      placeholder: paste a screenshot here / 在此粘贴截图

  - type: textarea
    id: environment
    attributes:
      label: Environment / 环境
      description: mongol-convert version, browser or CLI, whether the fonts loaded. / mongol-convert 版本、浏览器或 CLI、字体加载情况。
      render: text
      placeholder: |
        core: 0.7.1 (wasm)
        page: https://www.satsrag.dev/convert/
        fonts: delehi=loaded zvvn mod=loaded utn57=loaded
        ua: Mozilla/5.0 …

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting / 提交前
      options:
        - label: I checked the input really is in the selected source encoding — the converter reds out characters that are not. / 我确认过输入文本确实是所选源编码（转换器里越界字符会标红）。
          required: true
        - label: I have read the content above and it contains nothing I mind publishing. / 上面的内容我看过，不包含我不愿公开的文字。
          required: true
