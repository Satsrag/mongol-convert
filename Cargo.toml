[workspace]
resolver = "2"
members = ["crates/mongol-convert", "crates/mongol-convert-cabi", "crates/mongol-convert-uniffi", "crates/mongol-convert-wasm"]

# Future members (added as the port progresses):
#   "tools/table-gen"   — generator that emits crates/mongol-convert/src/tables/generated/*.rs
#   "crates/mongol-convert-wasm"  — wasm-bindgen binding (web)
#   "crates/mongol-convert-uniffi"— UniFFI binding (iOS/Android)
#   "crates/mongol-convert-cabi"  — C ABI binding (PHP-FFI / cgo / JNI·Panama)

[workspace.package]
edition = "2021"
license = "Apache-2.0"
